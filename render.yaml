services:
  - type: web
    name: devsuno-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GNANI_API_KEY
        sync: false   # paste your key in Render dashboard
    autoDeploy: true
