[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devsuno"
version = "0.1.0"
description = "Audio-native terminal copilot: speak bugs in Hinglish, get fixes spoken back."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["hinglish", "voice", "debugging", "terminal", "gnani", "STT", "TTS"]
dependencies = [
    "gnani-vachana>=0.9.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
mic = [
    "sounddevice>=0.5.0",
    "numpy>=1.26",
    "soundfile>=0.12.0",
]
all = ["devsuno[mic]"]

[project.scripts]
# Primary entry point — the brand name used in the brief
devsuno   = "voicepair.cli:main"
# Backward-compatible alias so existing README commands still work
voicepair = "voicepair.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voicepair*"]
